<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1118" />
  <title>Notfallprogramm</title>
  <style>
    :root{
      --bg:#0e1118;
      --panel:#171c26;
      --panel2:#1f2633;
      --text:#f4f7fb;
      --muted:#aeb7c7;
      --line:#2d3647;
      --accent:#8fb7ff;
      --good:#98d7b4;
      --warn:#ffd38b;
      --danger:#ff9b9b;
      --radius:22px;
      --shadow:0 18px 50px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh}
    button,input,textarea{font:inherit}
    button{touch-action:manipulation}
    .app{
      max-width:760px;
      margin:0 auto;
      min-height:100vh;
      padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    }
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .brand{font-weight:800;letter-spacing:.02em;font-size:14px;color:var(--muted);text-transform:uppercase}
    .iconbtn{
      background:transparent;border:1px solid var(--line);color:var(--text);border-radius:14px;padding:10px 12px
    }
    .card{
      background:linear-gradient(180deg,var(--panel),#131823);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:20px;
      margin-bottom:14px;
    }
    h1{font-size:30px;line-height:1.05;margin:0 0 10px}
    h2{font-size:22px;margin:0 0 12px}
    h3{font-size:16px;margin:0 0 8px}
    p{line-height:1.5;margin:8px 0 0}
    .muted{color:var(--muted)}
    .status-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
    .status-item{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:13px}
    .status-item .label{font-size:12px;color:var(--muted);margin-bottom:4px}
    .status-item .value{font-weight:750}
    .primary,.choice,.ghost,.danger-btn{
      width:100%;border:none;border-radius:16px;padding:15px 16px;font-weight:750;cursor:pointer;margin-top:10px;
    }
    .primary{background:var(--accent);color:#0e1625}
    .choice{background:var(--panel2);color:var(--text);border:1px solid var(--line);text-align:left}
    .ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
    .danger-btn{background:#5a2027;color:white;border:1px solid #8a3943}
    .choice:active,.primary:active,.ghost:active,.danger-btn:active{transform:scale(.99)}
    .menu{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}
    .menu button span{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:3px}
    .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 2px 8px}
    .quote{
      background:#10151e;border-left:4px solid var(--accent);padding:14px 15px;border-radius:10px;margin-top:12px;line-height:1.45
    }
    .bigword{font-size:28px;font-weight:900;letter-spacing:-.03em}
    .tiny{font-size:12px;color:var(--muted)}
    .row{display:flex;gap:10px}
    .row>*{flex:1}
    input,textarea{
      width:100%;background:#0f141d;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;outline:none
    }
    textarea{min-height:90px;resize:vertical}
    input:focus,textarea:focus{border-color:var(--accent)}
    .progress{height:10px;border-radius:99px;background:#0d1118;overflow:hidden;margin-top:12px;border:1px solid var(--line)}
    .progress > div{height:100%;background:var(--accent);width:0%;transition:width .35s ease}
    .pill{
      display:inline-block;padding:6px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--muted);margin:4px 4px 0 0
    }

    .checklist{display:grid;gap:8px;margin-top:14px}
    .checkrow{
      display:flex;align-items:center;gap:12px;padding:13px 14px;
      background:#111721;border:1px solid var(--line);border-radius:14px;
      cursor:pointer;user-select:none;
    }
    .checkrow input{
      width:22px;height:22px;margin:0;accent-color:var(--accent);flex:0 0 auto;
    }
    .checklabel{font-weight:650;line-height:1.35}
    .checkrow.done{opacity:.55}
    .checkrow.done .checklabel{text-decoration:line-through}

    .home-item{
      display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)
    }
    .home-item:first-child{border-top:none}
    .home-item button{width:auto;margin:0;padding:9px 11px;border-radius:12px}
    .timer{
      font-size:46px;font-weight:900;text-align:center;letter-spacing:.03em;margin:18px 0
    }
    .center{text-align:center}
    .redbutton{
      width:180px;height:180px;border-radius:50%;margin:24px auto 10px;display:block;border:8px solid #742f36;background:#c54450;color:white;font-weight:900;font-size:17px;box-shadow:0 0 0 8px rgba(197,68,80,.12),0 18px 40px rgba(0,0,0,.35)
    }
    .redbutton:active{transform:scale(.97)}
    .glitch{animation:glitch .18s steps(2,end) 5}
    @keyframes glitch{
      0%{transform:translate(0)}
      25%{transform:translate(3px,-2px)}
      50%{transform:translate(-2px,2px)}
      75%{transform:translate(2px,1px)}
      100%{transform:translate(0)}
    }
    .fade{animation:fade .28s ease}
    @keyframes fade{from{opacity:.2;transform:translateY(5px)}to{opacity:1;transform:none}}
    .hidden{display:none!important}
    .notice{padding:12px 14px;border-radius:14px;background:#111721;border:1px dashed var(--line);color:var(--muted);margin-top:12px}
    .spacer{height:8px}
    .footer{text-align:center;color:#657087;font-size:11px;margin-top:18px}

    .timer-list{display:grid;gap:10px;margin-top:14px}
    .timer-card{background:#101722;border:1px solid var(--line);border-radius:16px;padding:14px}
    .timer-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .timer-name{font-weight:800}
    .timer-left{font-variant-numeric:tabular-nums;font-weight:900;font-size:22px}
    .timer-sub{font-size:12px;color:var(--muted);margin-top:4px}
    @media (min-width:640px){
      .menu{grid-template-columns:1fr 1fr}
      h1{font-size:38px}
      .card{padding:24px}
    }
  </style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">NOTFALLPROGRAMM</div>
    <button class="iconbtn" id="homeBtn" aria-label="Startseite">⌂</button>
  </div>
  <main id="screen"></main>
  <div class="footer">Keine Lebensberatung. Eher ein sehr kleiner Systemneustart.</div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const screen = $('#screen');

  const state = {
    homeChecklist: JSON.parse(localStorage.getItem('kk_homeChecklist') || 'null') || [
      {id:'strom', label:'Strom', done:false},
      {id:'wasser', label:'Fließendes Wasser', done:false},
      {id:'toilette', label:'Funktionierende Toilette', done:false},
      {id:'dusche', label:'Dusche', done:false},
      {id:'schlafen', label:'Ort zum Schlafen', done:false},
      {id:'essen', label:'Möglichkeit, Essen zuzubereiten oder zu beschaffen', done:false},
      {id:'sofa', label:'Sofa, das alle wesentlichen Sofa-Aufgaben erfüllt', done:false}
    ],
    fixedHomeTopic: JSON.parse(localStorage.getItem('kk_fixedHomeTopic') || 'null'),
    currentAlien: null,
    currentSim: null,
    timer: null,
    activeTimers: JSON.parse(localStorage.getItem('np_activeTimers') || '[]')
  };

  function save(){
    localStorage.setItem('kk_homeChecklist', JSON.stringify(state.homeChecklist));
    localStorage.setItem('kk_fixedHomeTopic', JSON.stringify(state.fixedHomeTopic));
    localStorage.setItem('np_activeTimers', JSON.stringify(state.activeTimers));
  }

  function cleanupTimers(){
    const now = Date.now();
    const before = state.activeTimers.length;
    state.activeTimers = state.activeTimers.filter(t => t.endsAt > now);
    if(state.activeTimers.length !== before) save();
  }

  function addActiveTimer(name, minutes, type='focus'){
    cleanupTimers();
    const endsAt = Date.now() + minutes * 60 * 1000;
    if(type === 'emergency'){
      state.activeTimers = state.activeTimers.filter(t => t.type !== 'emergency');
    }
    state.activeTimers.push({id:'t_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), name, endsAt, type});
    save();
    ensureHomeTimerTicker();
    return endsAt;
  }

  function removeActiveTimer(id){
    state.activeTimers = state.activeTimers.filter(t => t.id !== id);
    save();
    home();
  }

  function formatRemaining(ms){
    const total = Math.max(0, Math.ceil(ms/1000));
    const m = Math.floor(total/60);
    const s = total%60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function activeTimersHTML(){
    cleanupTimers();
    if(!state.activeTimers.length) return '';
    return `
      <div class="section-title">Aktive Timer</div>
      <div class="timer-list">
        ${state.activeTimers.map(t => `
          <div class="timer-card">
            <div class="timer-head">
              <div>
                <div class="timer-name">${esc(t.name)}</div>
                <div class="timer-sub">${t.type==='emergency'?'Notbetrieb läuft':'Aktiver Timer'}</div>
              </div>
              <div class="timer-left" data-timer-id="${t.id}">${formatRemaining(t.endsAt-Date.now())}</div>
            </div>
            <button class="ghost" style="margin-top:10px" onclick="app.removeActiveTimer('${t.id}')">Timer beenden</button>
          </div>
        `).join('')}
      </div>`;
  }

  let homeTicker = null;
  function ensureHomeTimerTicker(){
    if(homeTicker) clearInterval(homeTicker);
    homeTicker = setInterval(() => {
      cleanupTimers();
      document.querySelectorAll('[data-timer-id]').forEach(el => {
        const t = state.activeTimers.find(x => x.id === el.dataset.timerId);
        if(t) el.textContent = formatRemaining(t.endsAt-Date.now());
      });
      if(!state.activeTimers.length && document.querySelector('[data-timer-id]')) home();
    }, 1000);
  }
  function rnd(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function render(html){ screen.innerHTML = `<div class="fade">${html}</div>`; window.scrollTo({top:0,behavior:'smooth'}); }
  function esc(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }

  function home(){
    clearTimer();
    cleanupTimers();
    ensureHomeTimerTicker();
    const activeTopic = state.fixedHomeTopic ? `
      <div class="notice">
        <strong>Wohnungsthema noch offen:</strong><br>
        ${esc(state.fixedHomeTopic)}
      </div>` : '';
    render(`
      <section class="card">
        <h1>Notfallprogramm</h1>
        <p class="muted">Problem abgeben, Entscheidung verkleinern oder für 30 Sekunden komplett unnötigen Blödsinn machen.</p>
        <div class="status-grid">
          <div class="status-item"><div class="label">Schlaf</div><div class="value">kritisch niedrig</div></div>
          <div class="status-item"><div class="label">Entscheidungskapazität</div><div class="value">eingeschränkt</div></div>
          <div class="status-item"><div class="label">Menschen, die etwas wollen</div><div class="value">auffällig viele</div></div>
          <div class="status-item"><div class="label">Romantik-Tendenzen</div><div class="value">unerwartet erhöht</div></div>
          <div class="status-item" style="grid-column:1/-1"><div class="label">Gesamtsystem</div><div class="value">erstaunlicherweise noch funktionsfähig</div></div>
        </div>
        ${activeTopic}
        ${activeTimersHTML()}
        <button class="primary" onclick="app.problemMenu()">PROBLEM AN SYSTEM ÜBERGEBEN</button>
        <button class="danger-btn" onclick="app.emergency()">🆘 JEMAND WILL WAS VON MIR</button>
        <button class="ghost" onclick="app.nonsenseMenu()">👽 30 SEKUNDEN KOMPLETTER BLÖDSINN</button>
      </section>
    `);
  }

  function problemMenu(){
    render(`
      <section class="card">
        <div class="section-title">Systemabfrage</div>
        <h2>Was ist heute das Problem?</h2>
        <div class="menu">
          <button class="choice" onclick="app.work()">💼 Arbeit<span>Geschäftsführerzeug, Blockaden, offene Themen</span></button>
          <button class="choice" onclick="app.homeStuff()">🏠 Zuhause<span>Wohnung, Bestellungen, „eigentlich müsste ich noch …“</span></button>
          <button class="choice" onclick="app.jga()">💍 JGA<span>Ist das Ding vielleicht längst ausreichend geplant?</span></button>
          <button class="choice" onclick="app.decisions()">🧠 Zu viele Entscheidungen<span>System übernimmt oder verhängt Denkverbot</span></button>
          <button class="choice" onclick="app.exhausted()">🪫 Ich bin einfach komplett im Arsch<span>Ressourcensparmodus ohne Selbstoptimierung</span></button>
          <button class="choice" onclick="app.everything()">🚨 Alles gleichzeitig<span>Wir reduzieren das auf etwas Bearbeitbares</span></button>
        </div>
      </section>
    `);
  }

  function exhausted(){
    const variants = [
      "Bestehende Probleme dürfen für 30 Minuten ohne aktive Betreuung weiterexistieren.",
      "Das Management wurde informiert. Es hat beschlossen, heute nicht jedes Feuer persönlich zu löschen.",
      "Nicht alles, was laut ist, ist dringend. Nicht alles, was dringend klingt, ist deins.",
      "Das System akzeptiert ab sofort nur noch Probleme mit nachgewiesener unmittelbarer Relevanz."
    ];
    render(`
      <section class="card">
        <div class="section-title">Ressourcensparmodus aktiviert</div>
        <h2>Für die nächsten 30 Minuten gelten drei Regeln:</h2>
        <div class="quote">
          <strong>Niemand wird gerettet.</strong><br>
          <strong>Nichts wird optimiert.</strong><br>
          <strong>Keine weitreichenden Entscheidungen.</strong>
        </div>
        <p>${rnd(variants)}</p>
        <button class="primary" onclick="app.exhaustedAccepted()">30 MINUTEN NOTBETRIEB STARTEN</button>
      </section>
    `);
  }

  function exhaustedAccepted(){
    addActiveTimer('Notbetrieb', 30, 'emergency');
    render(`
      <section class="card center">
        <div class="bigword">NOTBETRIEB LÄUFT</div>
        <p class="muted">Für 30 Minuten: niemand wird gerettet, nichts wird optimiert, keine weitreichenden Entscheidungen.</p>
        <div class="notice">Der Timer läuft auch weiter, wenn du auf der Startseite andere Funktionen benutzt.</div>
        <button class="primary" onclick="app.home()">STARTSEITE</button>
      </section>
    `);
  }

  function emergency(){
    render(`
      <section class="card">
        <div class="section-title">Notfallbutton</div>
        <h2>Jemand will etwas von dir.</h2>
        <p>Denk an genau diese eine Aufgabe.</p>
        <div class="quote"><strong>Musst wirklich DU das machen?</strong></div>
        <div class="row">
          <button class="choice center" onclick="app.emergencyMust()">JA, LEIDER</button>
          <button class="choice center" onclick="app.emergencyDelegate()">NEIN, EIGENTLICH NICHT</button>
        </div>
      </section>
    `);
  }

  function emergencyMust(){
    render(`
      <section class="card">
        <h2>Okay. Dann nur noch eine Frage.</h2>
        <p>Kannst oder willst du dich <strong>jetzt</strong> darum kümmern?</p>
        <div class="row">
          <button class="choice center" onclick="app.emergencyDoNow()">JA</button>
          <button class="choice center" onclick="app.emergencySayNo()">NEIN</button>
        </div>
      </section>
    `);
  }
  function emergencyDoNow(){
    render(`
      <section class="card">
        <h2>Dann mach nur den ersten Schritt.</h2>
        <p>Nicht das ganze Ding. Nicht die perfekte Lösung. Nur das, was du jetzt konkret anfangen kannst.</p>
        <button class="primary" onclick="app.startTimer(15)">15-MINUTEN-TIMER STARTEN</button>
      </section>
    `);
  }
  function emergencySayNo(){
    render(`
      <section class="card">
        <h2>Dann sag es.</h2>
        <p class="muted">Ohne Roman. Ohne Verteidigungsschrift.</p>
        <label class="tiny">Ab wann kümmerst du dich frühestens darum?</label>
        <input id="whenInput" placeholder="z. B. morgen Vormittag">
        <button class="primary" onclick="app.buildDelaySentence()">SATZ ERZEUGEN</button>
      </section>
    `);
  }
  function buildDelaySentence(){
    const when = ($('#whenInput')?.value || 'morgen').trim();
    const options = [
      `Nein, dafür habe ich gerade keine Kapazität. Ich kümmere mich frühestens ${when} darum.`,
      `Das bekomme ich heute nicht sinnvoll unter. Ich nehme es ${when} wieder auf.`,
      `Heute nicht mehr. Ich kümmere mich ${when} darum.`,
      `Das passt heute nicht mehr rein. Ich melde mich dazu ${when}.`
    ];
    render(`
      <section class="card">
        <div class="section-title">Bitte laut aussprechen</div>
        <div class="quote">${esc(rnd(options))}</div>
        <button class="ghost" onclick="app.home()">Fertig</button>
      </section>
    `);
  }

  function emergencyDelegate(){
    render(`
      <section class="card">
        <div class="section-title">Delegierungsprotokoll</div>
        <h2>Sehr gut.</h2>
        <p>Die Aufgabe muss also nicht zwingend auf deinem Schreibtisch sterben.</p>
        <label class="tiny">Wer kann sie übernehmen?</label>
        <input id="delegateName" placeholder="Name oder Rolle">
        <button class="primary" onclick="app.buildDelegateSentence()">SATZ ERZEUGEN</button>
      </section>
    `);
  }
  function buildDelegateSentence(){
    const who = ($('#delegateName')?.value || 'du').trim();
    const options = [
      `Darum kümmere ich mich nicht selbst. ${who}, bitte übernimm das und gib mir Bescheid, wenn du an einem Punkt nicht weiterkommst.`,
      `${who}, bitte übernimm das. Komm nur wieder auf mich zu, wenn du dafür tatsächlich eine Entscheidung von mir brauchst.`,
      `Das geht an ${who}. Bitte dort übernehmen und nur eskalieren, wenn wirklich etwas von mir benötigt wird.`,
      `${who} übernimmt das. Ich steige erst wieder ein, wenn eine konkrete Entscheidung bei mir liegt.`
    ];
    render(`
      <section class="card">
        <div class="section-title">Bitte laut aussprechen oder kopieren</div>
        <div class="quote">${esc(rnd(options))}</div>
        <button class="ghost" onclick="app.home()">Fertig</button>
      </section>
    `);
  }

  function work(){
    render(`
      <section class="card">
        <h2>Denk an genau eine Sache, die dich bei der Arbeit gerade nervt.</h2>
        <p class="muted">Nicht an sieben. Das System hat gefragt.</p>
        <button class="primary" onclick="app.workCanSolve()">HAB EINE</button>
      </section>
    `);
  }
  function workCanSolve(){
    render(`
      <section class="card">
        <h2>Kannst du dieses Problem heute tatsächlich lösen?</h2>
        <div class="row">
          <button class="choice center" onclick="app.workNow()">JA</button>
          <button class="choice center" onclick="app.workBlocked()">NEIN</button>
        </div>
      </section>
    `);
  }
  function workBlocked(){
    render(`
      <section class="card">
        <h2>Was fehlt?</h2>
        <div class="menu">
          <button class="choice" onclick="app.workMissing('Information')">Information</button>
          <button class="choice" onclick="app.workMissing('Entscheidung von jemand anderem')">Entscheidung von jemand anderem</button>
          <button class="choice" onclick="app.workMissing('Rückmeldung')">Rückmeldung</button>
          <button class="choice" onclick="app.workMissing('Zeit oder Termin')">Zeit / Termin</button>
          <button class="choice" onclick="app.workMissing('Nicht mein Problem')">Es liegt schlicht nicht bei mir</button>
        </div>
      </section>
    `);
  }
  function workMissing(type){
    let txt = '';
    if(type==='Information') txt = 'Dann ist deine Aufgabe nicht „Problem lösen“. Deine Aufgabe ist nur: Information beschaffen oder anfragen.';
    if(type==='Entscheidung von jemand anderem') txt = 'Das Problem befindet sich gerade auf einem fremden Schreibtisch. Bitte unterlassen Sie den Versuch, es telepathisch von dort zu lösen.';
    if(type==='Rückmeldung') txt = 'Du wartest. Warten ist kein aktives Projekt. Eine Erinnerung reicht; permanentes inneres Nachfassen ist nicht erforderlich.';
    if(type==='Zeit oder Termin') txt = 'Dann braucht das Problem einen Termin, nicht weitere Hirnleistung.';
    if(type==='Nicht mein Problem') txt = 'Ausgezeichnet. Zuständigkeit geklärt. Das System empfiehlt entschiedenes Nicht-Einsammeln fremder Aufgaben.';
    render(`
      <section class="card">
        <div class="section-title">Blockade erkannt</div>
        <div class="quote">${txt}</div>
        <button class="ghost" onclick="app.home()">VORGANG SCHLIESSEN</button>
      </section>
    `);
  }
  function workNow(){
    render(`
      <section class="card">
        <h2>Kannst du jetzt konkret etwas daran tun?</h2>
        <div class="row">
          <button class="choice center" onclick="app.startTimer(15)">JA – 15 MINUTEN</button>
          <button class="choice center" onclick="app.workSchedule()">NEIN</button>
        </div>
      </section>
    `);
  }
  function workSchedule(){
    render(`
      <section class="card">
        <h2>Dann braucht es keinen weiteren Gedanken.</h2>
        <p>Lege nur fest, wann du den nächsten konkreten Schritt machst.</p>
        <input id="workWhen" placeholder="z. B. morgen 09:30">
        <button class="primary" onclick="app.workScheduled()">FESTLEGEN</button>
      </section>
    `);
  }
  function workScheduled(){
    const val = ($('#workWhen')?.value || 'später').trim();
    render(`
      <section class="card">
        <div class="bigword">PARKPLATZ GEFUNDEN</div>
        <p>Nächster Kontakt mit diesem Problem: <strong>${esc(val)}</strong></p>
        <p class="muted">Bis dahin ist weiteres Nachdenken keine zusätzliche Leistung.</p>
        <button class="ghost" onclick="app.home()">Fertig</button>
      </section>
    `);
  }

  function homeStuff(){
    const checklist = state.homeChecklist.map((x,i)=>`

  function completeHomeTopic(){
    if(!state.fixedHomeTopic) return;
    const old = state.fixedHomeTopic;
    const existing = state.homeChecklist.find(x => x.label === old);
    if(existing){

    } else {
      state.homeChecklist.push({id:'custom_'+Date.now(), label:old, done:true});
    }
    state.fixedHomeTopic = null;
    save();
    render(`

    state.currentSim = rnd(simScenarios);
    render(`
      <section class="card">
        <div class="section-title">Simulationstest</div>
        <h2>${esc(state.currentSim.q)}</h2>
        <div class="row">
          <button class="choice center" onclick="app.simAnswer(true)">JA</button>
          <button class="choice center" onclick="app.simAnswer(false)">NEIN</button>
        </div>
      </section>
    `);
  }
  function simAnswer(yes){
    const text = yes ? state.currentSim.yes : state.currentSim.no;
    const pct = Math.floor(48 + Math.random()*47);
    render(`
      <section class="card center">
        <div class="bigword">SIMULATION: ${pct}%</div>
        <p>${esc(text)}</p>
        <div class="notice">Beweiskraft dieser Analyse: wissenschaftlich vollständig unhaltbar.</div>
        <button class="primary" onclick="app.simulation()">WEITER TESTEN</button>
        <button class="ghost" onclick="app.nonsenseMenu()">Genug Realität</button>
      </section>
    `);
  }

  function matrix(){
    render(`
      <section class="card center">
        <h2>KURZER REALITÄTSCHECK</h2>
        <p>Du bekommst zwei Pillen.</p>
        <div class="row">
          <button class="choice center" onclick="app.matrixBlue()">🔵 Blaue Pille<br><span class="tiny">Zurück zu deinen Aufgaben</span></button>
          <button class="choice center" onclick="app.matrixRed()">🔴 Rote Pille<br><span class="tiny">Die Wahrheit erfahren</span></button>
        </div>
      </section>
    `);
  }
  function matrixBlue(){
    render(`
      <section class="card center">
        <div class="bigword">ERNSTHAFT?</div>
        <p>Du hattest die Wahl zwischen Wahrheit und Arbeit und hast Arbeit gewählt.</p>
        <p class="muted">Die Matrix ist beeindruckt und ein bisschen besorgt.</p>
        <button class="ghost" onclick="app.nonsenseMenu()">Zurück</button>
      </section>
    `);
  }
  function matrixRed(){
    render(`
      <section class="card center">
        <div class="bigword">DIE WAHRHEIT</div>
        <p>Du hast gerade auf einen roten Kreis in einer HTML-Datei gedrückt.</p>
        <div class="notice">Morpheus wäre enttäuscht.</div>
        <button class="ghost" onclick="app.nonsenseMenu()">Zurück in die Simulation</button>
      </section>
    `);
  }

  function glitch(){
    const cmds = [
      "Berühre den nächstgelegenen Gegenstand, der blau ist.",
      "Schau drei Sekunden ernst auf irgendeinen Gegenstand und tu so, als hättest du gerade etwas Entscheidendes verstanden.",
      "Dreh dich einmal um und prüfe, ob hinter dir noch dieselbe Realität geladen ist.",
      "Tippe zweimal auf irgendeinen Tisch. Niemand weiß warum.",
      "Suche einen Gegenstand, dessen Existenz du heute bisher komplett ignoriert hast.",
      "Schau kurz aus dem Fenster und bewerte die Grafikqualität.",
      "Bewege einen Gegenstand exakt fünf Zentimeter und hinterfrage nichts.",
      "Sag leise „interessant“ und schau dabei auf etwas völlig Banales."
    ];
    render(`
      <section class="card center glitch">
        <div class="section-title">Glitch erkannt</div>
        <h2>${esc(rnd(cmds))}</h2>
        <p class="muted">Du hast 10 Sekunden. Der Sinn wird nicht nachgereicht.</p>
        <button class="primary" onclick="app.glitchDone()">ERLEDIGT</button>
      </section>
    `);
  }
  function glitchDone(){
    const lines=[
      "Perfekt. Niemand weiß, warum. Einschließlich des Systems.",
      "Lore erfolgreich erweitert.",
      "Die Simulation hat die Eingabe akzeptiert.",
      "Keine sichtbaren Auswirkungen. Genau wie geplant.",
      "Realität weiterhin erstaunlich stabil."
    ];
    render(`
      <section class="card center">
        <div class="bigword">GLITCH VERARBEITET</div>
        <p>${esc(rnd(lines))}</p>
        <button class="primary" onclick="app.glitch()">NOCH EIN GLITCH</button>
        <button class="ghost" onclick="app.nonsenseMenu()">Genug Unsinn</button>
      </section>
    `);
  }

  function startTimer(minutes){
    clearTimer();
    const endsAt = addActiveTimer(`${minutes}-Minuten-Fokus`, minutes, 'focus');
    const timerId = state.activeTimers[state.activeTimers.length-1].id;
    render(`
      <section class="card center">
        <div class="section-title">Fokusmodus</div>
        <h2>Nur dieses eine Ding.</h2>
        <div class="timer" id="timer">${formatRemaining(endsAt-Date.now())}</div>
        <p class="muted">Danach darfst du weitermachen oder aufhören. Beides zählt.</p>
        <button class="ghost" onclick="app.stopSpecificTimer('${timerId}')">Timer beenden</button>
        <button class="ghost" onclick="app.home()">Zur Startseite – Timer läuft weiter</button>
      </section>
    `);
    state.timer=setInterval(()=>{
      const remaining = endsAt - Date.now();
      const el=$('#timer');
      if(el) el.textContent=formatRemaining(remaining);
      if(remaining<=0){
        clearTimer();
        state.activeTimers = state.activeTimers.filter(t=>t.id!==timerId);
        save();
        render(`
          <section class="card center">
            <div class="bigword">${minutes} MINUTEN. ENDE.</div>
            <p>Du darfst weitermachen. Du darfst aufhören.</p>
            <div class="notice">Das System übernimmt keine Haftung für plötzlich auftretende Produktivität.</div>
            <button class="ghost" onclick="app.home()">Zurück</button>
          </section>
        `);
      }
    },1000);
  }
  function clearTimer(){
    if(state.timer){clearInterval(state.timer);state.timer=null;}
  }
  function stopSpecificTimer(id){
    clearTimer();
    state.activeTimers = state.activeTimers.filter(t=>t.id!==id);
    save();
    home();
  }
  function stopTimer(){ clearTimer(); home(); }

  document.getElementById('homeBtn').addEventListener('click', home);

  window.app = {
    home, problemMenu, exhausted, exhaustedAccepted, emergency, emergencyMust, emergencyDoNow, emergencySayNo,
    buildDelaySentence, emergencyDelegate, buildDelegateSentence, work, workCanSolve, workBlocked, workMissing,
    workNow, workSchedule, workScheduled, homeStuff, toggleHome, evaluateHome, homeNoNeed, homeComfort, fixHomeTopic,
    completeHomeTopic, selectOpenHomeTopic, jga, jgaAnswer, decisions, thoughtBan, randomDecision, pickDecision, everything, everythingNo,
    everythingYes, everythingCan, showNextStep, everythingCant, nonsenseMenu, forbiddenButton, forbiddenPressed,
    smileTest, smileAnswer, alien, alienAnswer, simulation, simAnswer, matrix, matrixBlue, matrixRed, glitch, glitchDone,
    startTimer, stopTimer, stopSpecificTimer, removeActiveTimer
  };

  ensureHomeTimerTicker();
  home();
})();
</script>
</body>
</html>
